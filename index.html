      <section>
        <h2 id="character-list-title" style="display: none;">對應動畫角色</h2>

        <p id="character-status" style="display: none;">正在讀取角色資料……</p>

      <section id="search-animes">
        <h2>搜尋動畫</h2>
        <p id="anime-search-status"></p>
        <form id="anime-search-form" class="search-form">
          <label class="visually-hidden" for="anime-search">動畫名稱</label>
          <input
            id="anime-search"
            type="search"
            placeholder="輸入動畫名稱"
          />

          <label class="visually-hidden" for="anime-season">
          播出季度
          </label>
          <select id="anime-season">
            <option value="">請選擇季度</option>
            <option value="1">冬季</option>
            <option value="2">春季</option>
            <option value="3">夏季</option>
            <option value="4">秋季</option>
          </select>

          <button class="search-button" type="submit">搜尋</button>
        </form>

        <ul id="anime-search-results"></ul>
      </section>
